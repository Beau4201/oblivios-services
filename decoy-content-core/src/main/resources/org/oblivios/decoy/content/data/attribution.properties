# The credits that the licences of the data files require. One entry per source.
places.cbs=Source: CBS (squares of 100 by 100 metres with statistics 2025, table 86247NED, municipality boundaries through PDOK), CC BY 4.0, https://creativecommons.org/licenses/by/4.0/. Changed: populated squares only, as centre points in WGS84, each given a municipality; one middle point per municipality. CBS does not endorse this use.
places.names=Common municipality names: Wikidata, CC0 1.0. School holiday regions and school holidays: Rijksoverheid, CC0 1.0.
places.osm=Venues: (c) OpenStreetMap contributors, https://www.openstreetmap.org/copyright. The file places/NL/venues.tsv.gz is a database under the Open Database License 1.0, https://opendatacommons.org/licenses/odbl/1-0/. Changed: name, kind and position only, per municipality.
holidays.vacanza=Public holidays: vacanza/holidays 0.109, MIT License, https://github.com/vacanza/holidays.
population.cbs=Source: CBS, table 85458NED, CC BY 4.0, https://creativecommons.org/licenses/by/4.0/. Changed: residents on 1 January 2026 by municipality, age band, sex and 14 origins, the rest summed. CBS does not endorse this use.
numbers.libphonenumber=Phone number formats and Dutch area codes: google/libphonenumber v9.0.44, Apache License 2.0, https://github.com/google/libphonenumber. Changed: the patterns of one file per territory, the never types joined.
spreads.cbs=Source: CBS, tables 85458NED, 86411NED, 85264NED and 84709NED, CC BY 4.0, https://creativecommons.org/licenses/by/4.0/. Changed: filtered to the Netherlands and one period, positions and modes summed. CBS does not endorse this use.
spreads.pets=Shares of households with a pet: Ipsos I&O for Dibevo and NVG, published 2025-05-08, figures cited.
calls.cns=Shape of calls: Copenhagen Networks Study interaction data (Sapiezynski, Stopczynski, Lassen, Lehmann), figshare 7267433 version 1, MIT License. Changed: quantiles and shares of half of the callers.
texts.cldr=Weekday names: Unicode CLDR 49, Copyright (c) 1991-2026 Unicode, Inc., Unicode License v3, https://www.unicode.org/license.txt.
texts.wiktionary=Dutch street words and family words: WikiWoordenboek contributors, https://nl.wiktionary.org (categories Straattaal in het Nederlands and Familie in het Nederlands), CC BY-SA 4.0, https://creativecommons.org/licenses/by-sa/4.0/. Changed: words taken by the labels of their senses and by synonym lists. The files text/nl/street-register.properties and text/nl/kin.properties stay under CC BY-SA 4.0.
interests.cbs=Source: CBS, table 86295NED, CC BY 4.0, https://creativecommons.org/licenses/by/4.0/. Changed: sports and cultural hobbies of 2024 with every figure, per sex and age band; the names are the table's topic titles. CBS does not endorse this use.
texts.wiktionary.roles=Role labels: WikiWoordenboek contributors, https://nl.wiktionary.org (pages huisarts and tandarts), CC BY-SA 4.0, https://creativecommons.org/licenses/by-sa/4.0/. Changed: the page titles only. The file text/nl/labels.properties stays under CC BY-SA 4.0.
texts.rijksoverheid=Names of the official holidays: Rijksoverheid, CC0 1.0.
texts.snowball=Stop word lists: Snowball (https://snowballstem.org), BSD-3-Clause, https://snowballstem.org/license.html.
names.wikidata=Names of births to 2009 and family names: Wikidata, CC0 1.0.
names.statbel=Source: Statbel, first names of newborns 1995-2025 (Flanders), CC BY 4.0, https://creativecommons.org/licenses/by/4.0/. Changed: births from 2010 only, summed into 5-year periods, the 500 most common per sex and period.
