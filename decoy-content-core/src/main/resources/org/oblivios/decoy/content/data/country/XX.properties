# The neutral pack: the pack of a device whose country has no pack or no number data, and the
# defaults of every other pack. Global senders only, no local bank or shop, and no numbers (a decoy of
# it is refused). No language: its texts follow the persona's language.
code=XX
language=
# source: no law is read for the neutral pack; the forms and their weights are [assumption].
family.child=FATHER:80|MOTHER:10|BOTH:10
# source: as family.child above: the married form of the same file's note, with [assumption] weights.
family.married=OWN:55|PARTNER:20|PARTNER_OWN:20|OWN_PARTNER:5
senders.GLOBAL=Google|Apple|Microsoft|WhatsApp|Amazon|PayPal
# The shops of a pack that sell only online (S-PHYSICAL); the neutral pack has no shops.
senders.SHOP.online=
# No local supermarkets, as no local shops.
supermarkets=
# No source names these days, so the calendar has no entry for them.
holidays=fixed 01-01|fixed 12-25
wifi=HOME-####|WiFi-######|NETWORK-###
amount={n}
mms.groups=0-1
sites.GLOBAL=wikipedia.org|youtube.com|reddit.com|github.com|stackoverflow.com|openstreetmap.org|\
  duckduckgo.com|imdb.com|archive.org|weather.com
# shortcut: approximate centres written by hand, names as written in English; the setup's place data
# (GeoNames) can replace them, with the names in the persona's language.
trips.abroad=Paris 48.86 2.35|Berlin 52.52 13.40|Barcelona 41.39 2.17|Lisbon 38.72 -9.14|Rome 41.90 12.50|\
  Vienna 48.21 16.37|Prague 50.08 14.44|Copenhagen 55.68 12.57|London 51.51 -0.13|Athens 37.98 23.73|\
  Madrid 40.42 -3.70|Dublin 53.35 -6.26
