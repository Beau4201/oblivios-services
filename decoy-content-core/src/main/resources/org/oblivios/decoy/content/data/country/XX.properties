# The neutral pack: the pack of a device whose country has no pack or no verified number range, and the
# defaults of every other pack. Global senders only, no local bank or shop, and no numbers of its own (a
# made-up number could belong to a real person). No language: its texts follow the persona's language.
code=XX
language=
given=Alex|Sam|Chris|Jamie|Taylor|Jordan|Robin|Morgan|Casey|Quinn|Maria|Daniel|\
  Sofia|David|Laura|Marco|Anna|Thomas|Julia|Lucas|Nina|Adam|Elena|Omar|\
  Mia|Leo|Eva|Noah|Zoe|Hugo|Lena|Felix|Clara|Ivan|Sara|Karim|Emma|Jonas|\
  Nora|Tim|Ida|Paul|Rita|Ben|Lea|Max|Vera|Dan
