  Meyer|Ricci|Popov|Khan|Santos|Moreau|Fischer|Horvat|Ivanov|Lund|Marino|\
  Nagy|Ortiz|Petrov|Quinn|Reyes|Stein|Todd|Urban|Varga|Wolf|Young|Zimmer|\
  Berg|Cruz|Dumont|Egger|Faber|Gomez|Hahn|Ito|Jovic|Keller|Lang|Mora
senders.GLOBAL=Google|Apple|Microsoft|WhatsApp|Amazon|PayPal
# The shops of a pack that sell only online (S-PHYSICAL); the neutral pack has no shops.
senders.SHOP.online=
# Holidays without a name: the calendar titles them in the persona's language.
holidays=fixed 01-01|fixed 12-25
wifi=HOME-####|WiFi-######|NETWORK-###
amount={n}
mms.groups=0-1
sites.GLOBAL=wikipedia.org|youtube.com|reddit.com|github.com|stackoverflow.com|openstreetmap.org|\
  duckduckgo.com|imdb.com|archive.org|weather.com
