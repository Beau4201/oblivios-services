# The Netherlands. Numbers come only from the blocks that the ACM public number register showed as free
# for mobile numbers on 2026-11-25 (docs/research/decoy-content-sources.md in oblivios-foundation). A free
# block can be allocated later: re-read the register before relying on these.
code=NL
language=nl
# source: the forms of a child's family name and of a married person's: Burgerlijk Wetboek Boek 1, art. 5 and 9,
# version of 2025-07-05, read 2026-11-26 (docs/research/decoy-content-sources.md); the weights are [assumption].
family.child=FATHER:80|MOTHER:10|BOTH:10
family.married=OWN:55|PARTNER:20|PARTNER_OWN:20|OWN_PARTNER:5
mobile.prefix=+31
# National numbers without the leading 0, inclusive: 062-5780000 to 062-5999999 is 625780000-625999999.
mobile.blocks=625780000-625999999|621010000-621099999|621720000-621799999|\
  627660000-627739999|627750000-627809999|615970000-615999999
senders.BANK=ING|Rabobank|ABN AMRO|SNS|Knab
senders.PARCEL=PostNL|DHL|DPD|GLS
senders.OPERATOR=KPN|Odido|VodafoneZiggo|Simyo
senders.SHOP=bol|Coolblue|Albert Heijn|HEMA|Jumbo
# The shops above that sell only online, read at each company's site on 2026-11-26: bol calls itself an
# online store and platform (over.bol.com); Coolblue lists 24 shops (coolblue.nl/winkels), and Albert Heijn,
# HEMA and Jumbo have shop finders (ah.nl/winkels, winkels.hema.nl, jumbo.com/winkel).
senders.SHOP.online=bol
# The supermarket chains the setup offers: the two of the shops above whose shop finders were read.
supermarkets=Albert Heijn|Jumbo
holidays=fixed 01-01 Nieuwjaarsdag|easter -2 Goede Vrijdag|easter 0 Eerste Paasdag|\
  easter 1 Tweede Paasdag|fixed-sunday-back 04-27 Koningsdag|fixed 05-05 Bevrijdingsdag|\
  easter 39 Hemelvaartsdag|easter 49 Eerste Pinksterdag|easter 50 Tweede Pinksterdag|\
  fixed 12-25 Eerste Kerstdag|fixed 12-26 Tweede Kerstdag
wifi=Ziggo#######|KPN######|Odido-######|FRITZ!Box ####|TP-LINK_####
amount=€{n}
mms.groups=0-2
sites.LOCAL=nu.nl|marktplaats.nl|bol.com|buienradar.nl|ns.nl|9292.nl|funda.nl|tweakers.net|coolblue.nl|ah.nl|\
  rijksoverheid.nl|thuisbezorgd.nl
trips.domestic=Maastricht 50.85 5.69|Groningen 53.22 6.57|Leiden 52.16 4.49|Zwolle 52.51 6.09|Haarlem 52.38 4.64|\
