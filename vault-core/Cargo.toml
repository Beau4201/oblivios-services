# SPDX-License-Identifier: Apache-2.0
# The core of the ObliviOS Passwords app (ADR-185): the sealed vault, the key wrappers, the domain index, the checkup
# and the export file. Built with the AOSP Rust toolchain (1.93.1), `--locked --offline`, from this tree only (tools/env.sh).
[package]
name = "vault-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
license = "Apache-2.0"
description = "ObliviOS Passwords app core (ADR-185)"

[lib]
name = "vault_core"
path = "src/lib.rs"
# rlib for the host tests, cdylib for the JNI library the app loads.
crate-type = ["rlib", "cdylib"]

[dependencies]
# Pure Rust RustCrypto crates with their default features off: nothing links C code and nothing reads the network.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
hkdf = { version = "0.12", default-features = false }
# The public suffix list, compiled in (no fuzzy match, no list fetched at run time).
psl = { version = "2", default-features = false, features = ["helpers"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
subtle = { version = "2", default-features = false }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
jni = { version = "0.21", default-features = false }

[workspace]

[profile.dev.package."*"]
# Host tests run the crypto crates: optimised dependencies keep a 64 MiB vault test to seconds instead of minutes.
opt-level = 3

[profile.release]
# The Android standard library of the AOSP tree has no unwind strategy: every panic ends the process.
panic = "abort"
# An arithmetic overflow ends the process like any panic here, instead of wrapping silently (review of 2026-10-23, P-22).
overflow-checks = true
opt-level = "z"
lto = true
codegen-units = 1
